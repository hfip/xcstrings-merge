[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "xcstrings-merge"
version = "0.1.1"
description = "Merge legacy .strings translations into an Xcode String Catalog."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdulluh.X", email = "199844698+hfip@users.noreply.github.com" }]
keywords = ["xcstrings", "strings", "ios", "localization", "migration", "xcode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
xcstrings-merge = "xcstrings_merge.cli:main"
xcm = "xcstrings_merge.cli:main"

[project.urls]
Homepage = "https://github.com/hfip/xcstrings-merge"
Issues = "https://github.com/hfip/xcstrings-merge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xcstrings_merge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
